# Agamos — nginx site config.
# Place at /etc/nginx/sites-available/agamos and symlink into sites-enabled.
# Serves the React SPA, proxies the Django API/admin to gunicorn, serves media.
# After this works on port 80, run: certbot --nginx -d agamos.example.com -d www.agamos.example.com
# (certbot rewrites this block to add the HTTPS server on 443 + redirect.)

upstream agamos_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name agamos.example.com www.agamos.example.com;

    # Allow image uploads (covers, gallery, gifts)
    client_max_body_size 12M;

    # ---- React single-page app ----
    root /opt/agamos/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite build assets — long cache
    location /assets/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # ---- Django API + admin (gunicorn) ----
    location /api/ {
        proxy_pass http://agamos_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://agamos_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public event pages — Django injects Open Graph meta for rich link previews,
    # then the same SPA shell hydrates the full app for real browsers.
    location /r/ {
        proxy_pass http://agamos_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django/admin/DRF collected static (after `collectstatic`)
    location /static/ {
        alias /opt/agamos/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # User-uploaded media
    location /media/ {
        alias /opt/agamos/backend/media/;
        expires 7d;
    }
}
